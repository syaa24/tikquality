<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Quality Web — 1080p60 Container Enhancer & Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">TikTok Quality Web</h1>
        <p class="text-sm text-slate-400">
          Zero re-encoding MP4 container manipulation (100% Python engine di browser)
        </p>
      </div>
      <span id="pyStatus" class="text-xs px-3 py-1.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30 w-fit">
        Memuat Python Engine...
      </span>
    </header>

    <!-- Tabs -->
    <div class="flex gap-2 border-b border-slate-800 mb-6">
      <button data-tab="enhancer" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-cyan-400 text-cyan-300">
        MP4 Enhancer & Verify
      </button>
      <button data-tab="checker" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200">
        TikTok URL Checker
      </button>
      <button data-tab="compare" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200">
        Byte-Compare
      </button>
    </div>

    <!-- TAB 1: ENHANCER -->
    <section id="tab-enhancer" class="space-y-5">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Pilih Video MP4 (H.264 / AVC)</label>
          <input id="videoInput" type="file" accept="video/mp4,.mp4"
            class="block w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/30 cursor-pointer bg-slate-950 border border-slate-800 rounded-lg p-2" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Frame Multiplier (-m)</label>
            <input id="multiplierInput" type="number" value="10" min="1" max="100"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Metadata Comment (--comment)</label>
            <input id="commentInput" type="text" value="TK8vY5VqBA6hUlo1yuGvNA"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500" />
          </div>
        </div>

        <div class="flex flex-wrap gap-3">
          <button id="transformBtn" disabled
            class="px-5 py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-semibold text-sm transition">
            Proses Video (Enhance)
          </button>
          <button id="inspectOnlyBtn" disabled
            class="px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-sm transition">
            Cek Struktur MP4 Saja
          </button>
          <a id="downloadBtn" class="hidden px-5 py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm transition">
            Download Output MP4
          </a>
        </div>
      </div>

      <!-- Hasil Inspeksi Sebelum vs Sesudah -->
      <div id="verifyResult" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>

      <!-- Terminal Output -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Console Log (Python)</div>
        <pre id="consoleLog" class="text-xs font-mono text-emerald-300 whitespace-pre-wrap min-h-[90px]">Menunggu file MP4...</pre>
      </div>
    </section>

    <!-- TAB 2: TIKTOK URL CHECKER (ALA GAMBAR 1) -->
    <section id="tab-checker" class="hidden space-y-5">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
        <label class="block text-sm font-medium text-slate-300">Link Video TikTok (Sudah di-upload)</label>
        <div class="flex gap-2">
          <input id="tiktokUrlInput" type="url" placeholder="https://www.tiktok.com/@username/video/765207..."
            class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500" />
          <button id="checkUrlBtn" class="px-5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm">
            Check
          </button>
        </div>
      </div>

      <div id="tiktokAnalyticsCard" class="hidden bg-[#17212b] border border-slate-700/70 rounded-xl p-5 font-mono text-sm space-y-4 shadow-xl"></div>
    </section>

    <!-- TAB 3: BYTE COMPARE -->
    <section id="tab-compare" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <p class="text-sm text-slate-400">Bandingkan hasil web ini dengan file reference dari CLI Python untuk memastikan 100% byte-for-byte identik.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">File 1 (Output Web)</label>
            <input id="cmpFile1" type="file" class="w-full text-xs bg-slate-950 border border-slate-800 rounded-lg p-2" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">File 2 (Reference CLI)</label>
            <input id="cmpFile2" type="file" class="w-full text-xs bg-slate-950 border border-slate-800 rounded-lg p-2" />
          </div>
        </div>
        <button id="compareBtn" class="px-5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm">
          Compare Bytes
        </button>
        <div id="compareResult" class="text-sm font-mono"></div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
